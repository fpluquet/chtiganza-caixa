<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caixa">
<meta name="robots" content="noindex,nofollow">
<title>Caixa Chtiganza</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#151515;--mute:#8d8c88;--line:#e4e2dd;--accent:#ff5a1f;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e0e10;--card:#18181b;--ink:#f1f0ec;--mute:#76757a;--line:#26262a;--accent:#ff6a33;--accent-ink:#111}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:grid;place-items:center;padding:24px 16px;-webkit-font-smoothing:antialiased}
form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
.mark{width:56px;height:56px;border-radius:24%;background:var(--ink);margin-bottom:10px}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
p{margin:0 0 10px;color:var(--mute);font-size:14px;letter-spacing:.14em;text-transform:uppercase}
input[type=password]{width:100%;height:54px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  font:inherit;font-size:18px;padding:0 16px;outline:none;transition:border-color .15s}
input[type=password]:focus{border-color:var(--ink)}
.bad input[type=password]{border-color:var(--accent);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
label{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mute);min-height:32px}
label input{width:18px;height:18px;accent-color:var(--accent)}
button{height:54px;border-radius:14px;border:0;background:var(--ink);color:var(--bg);font:inherit;font-weight:650;font-size:17px;cursor:pointer}
button:disabled{opacity:.6}
#err{min-height:20px;color:var(--accent);font-size:14px;margin:0}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <div class="mark"></div>
  <h1>Caixa</h1>
  <p>Chtiganza</p>
  <input type="password" id="pw" placeholder="Mot de passe" aria-label="Mot de passe" autocomplete="current-password" required>
  <label><input type="checkbox" id="rem" checked>Se souvenir de moi sur cet appareil</label>
  <button id="go">Entrer</button>
  <p id="err" role="alert"></p>
</form>

const KEY = 'caixa-gate-key';
const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const bu = a => btoa(String.fromCharCode(...new Uint8Array(a)));
async function derive(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', hash:'SHA-256', salt:ub(P.s), iterations:P.n }, base,
    { name:'AES-GCM', length:256 }, true, ['decrypt']);
}
// Remplacer la page n'est fiable qu'une fois le chargement terminé : sinon
// document.open() est ignoré et l'appli s'ajoute SOUS le formulaire.
const loaded = () => document.readyState === 'complete' ? Promise.resolve()
  : new Promise(r => window.addEventListener('load', r, { once:true }));
async function show(html){
  await loaded();
  document.open(); document.write(html); document.close();
}
async function decrypt(key){
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv:ub(P.i) }, key, ub(P.d)));
}
const f = document.getElementById('f'), pw = document.getElementById('pw'), go = document.getElementById('go'), err = document.getElementById('err');
// Clé mémorisée : on masque le formulaire tout de suite, et on ouvre directement
let saved = null;
try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
if (saved && saved.s === P.s){
  f.style.visibility = 'hidden';
  (async () => {
    try {
      const k = await crypto.subtle.importKey('raw', ub(saved.k), 'AES-GCM', false, ['decrypt']);
      await show(await decrypt(k));
    } catch (e) {
      try { localStorage.removeItem(KEY); } catch (_) {}
      f.style.visibility = ''; pw.focus();
    }
  })();
} else pw.focus();
f.addEventListener('submit', async e => {
  e.preventDefault();
  if (!window.crypto || !crypto.subtle){ err.textContent = 'Ouvre la page en https.'; return; }
  const remember = document.getElementById('rem').checked;
  go.disabled = true; go.textContent = '…'; err.textContent = ''; f.classList.remove('bad');
  try {
    const k = await derive(pw.value);
    const raw = await crypto.subtle.exportKey('raw', k);
    const html = await decrypt(k);
    try { if (remember) localStorage.setItem(KEY, JSON.stringify({ s:P.s, k:bu(raw) })); } catch (_) {}
    await show(html);
  } catch (e2) {
    go.disabled = false; go.textContent = 'Entrer';
    void f.offsetWidth; f.classList.add('bad'); err.textContent = 'Mot de passe incorrect.'; pw.select();
  }
});
})();
